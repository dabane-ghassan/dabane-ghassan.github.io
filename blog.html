<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Notes on classic literature, technology and mathematics by Ghassan Dabane.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="Ghassan Dabane — Blog" href="feed.xml">
  <script>
    (function () {
      var d = document.documentElement, t, l;
      try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
      if (t) d.dataset.theme = t;
      if (!l) l = (navigator.language || 'en').slice(0, 2) === 'fr' ? 'fr' : 'en';
      d.dataset.lang = l; d.lang = l;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="blog">

<span hidden data-title-en="Blog — Ghassan Dabane" data-title-fr="Blog — Ghassan Dabane"></span>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="./" aria-label="Ghassan Dabane — home"><span class="rgb" aria-hidden="true"><i></i><i></i><i></i></span>Ghassan Dabane</a>

      <a href="./#me" data-nav="me" style="--c:var(--red)"><span lang="en">Me</span><span lang="fr">Moi</span></a>
      <a href="./#publications" data-nav="publications" style="--c:var(--green)">Publications</a>
      <a href="./#presentations" data-nav="presentations" style="--c:var(--blue)"><span lang="en">Talks</span><span lang="fr">Exposés</span></a>
      <a href="./#projects" data-nav="projects" style="--c:var(--red)"><span lang="en">Projects</span><span lang="fr">Projets</span></a>
      <a href="./#blog" data-nav="blog" style="--c:var(--green)">Blog</a>
      <a href="./#teaching" data-nav="teaching" style="--c:var(--blue)"><span lang="en">Teaching</span><span lang="fr">Enseignement</span></a>
    </nav>
    <div class="tools">
      <button class="toggle" id="lang-toggle" type="button" aria-label="Français / English"><span data-l="en">EN</span><span class="sep">/</span><span data-l="fr">FR</span></button>
      <button class="toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="theme-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path class="half" d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>

</header>

<main id="main" class="wrap">
  <header class="page-head">
    <h1><span lang="en">Blog</span><span lang="fr">Blog</span></h1>
  </header>
  <div class="filters" id="filters" role="toolbar" aria-label="Tags"></div>
  <div id="list" aria-live="polite"></div>
</main>

<footer class="site-footer">
  <div class="wrap foot-row">
    <span class="mono"><span class="rgb" aria-hidden="true"><i></i><i></i><i></i></span>&nbsp; © <span data-year>2026</span> Ghassan Dabane</span>
    <span class="mono quote"><span lang="en">The quieter you become, the more you’re able to hear.</span><span lang="fr">Plus tu deviens silencieux, plus tu es capable d’entendre.</span></span>
  </div>
</footer>

<script src="assets/js/site.js"></script>
<script src="assets/js/posts.js"></script>
<script>
(function () {
  var tag = new URLSearchParams(location.search).get('tag'), all = [];
  var filters = document.getElementById('filters'), list = document.getElementById('list');
  function draw() {
    var l = Site.lang(), posts = Posts.forLang(all, l), tags = [];
    posts.forEach(function (p) { (p.tags || []).forEach(function (t) { if (tags.indexOf(t) < 0) tags.push(t); }); });
    tags.sort();
    filters.innerHTML = tags.length < 2 ? '' :
      '<button class="chip' + (tag ? '' : ' on') + '" data-tag="">' + Site.t('all') + '</button>' +
      tags.map(function (t) { return '<button class="chip' + (tag === t ? ' on' : '') + '" data-tag="' + Posts.esc(t) + '">' + Posts.esc(t) + '</button>'; }).join('');
    var shown = posts.filter(function (p) { return !tag || (p.tags || []).indexOf(tag) >= 0; });
    if (!shown.length) { list.innerHTML = '<ul class="lines"><li class="empty">' + Site.t('soon') + '</li></ul>'; return; }
    var byYear = {};
    shown.forEach(function (p) { var y = (p.date || '').slice(0, 4); (byYear[y] = byYear[y] || []).push(p); });
    list.innerHTML = Object.keys(byYear).sort().reverse().map(function (y) {
      return '<section class="year-group"><h2>' + y + '</h2><ul class="lines">' + byYear[y].map(function (p) { return Posts.itemHTML(p, l); }).join('') + '</ul></section>';
    }).join('');
  }
  filters.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tag]'); if (!b) return;
    tag = b.dataset.tag || null; draw();
  });
  Posts.load().then(function (p) { all = p; draw(); });
  document.addEventListener('langchange', draw);
})();
</script>
</body>
</html>
